services:
  - type: web
    name: spielfranzen
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build
    startCommand: npx prisma db push --schema=backend/prisma/schema.prisma && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spielfranzen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: spielfranzen-db
    plan: free
